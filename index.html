<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2A1446">
<title>AGM Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Caveat:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: app shell — sidebar on desktop, bottom tab bar on phone; one "next class" hero in the club's night-sky look, then lists. */
:root{
  --bg:#F5F1F8; --surface:#FFFFFF; --surface-2:#EFE8F5; --line:#E3D9EC;
  --ink:#16112A; --muted:#6C6378;
  --violet:#722F9D; --violet-soft:#EADCF5; --cyan:#1FA3B0; --cyan-glow:#5EE3E8; --magenta:#9D2E94; --star:#FFCC00;
  --ok:#17875E; --ok-soft:#DDF3E9; --no:#C8394F; --no-soft:#FBE3E7; --wait:#9A6A00; --wait-soft:#FFF3CC;
  --night:#0B1E25; --night-2:#2A1446; --on-night:#F7F1FF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Nunito Sans","Segoe UI",system-ui,sans-serif;
  --f-script:"Caveat","Segoe Script","Bradley Hand",cursive;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A161C; --surface:#12242C; --surface-2:#1A2F39; --line:#24404B;
  --ink:#F2EEF7; --muted:#A49CB2;
  --violet:#C08AE8; --violet-soft:#2E2140; --magenta:#E77AD9; --cyan:#5EE3E8; --cyan-glow:#5EE3E8;
  --ok:#4FD39C; --ok-soft:#123A2C; --no:#FF8094; --no-soft:#3E1C25; --wait:#F2C94C; --wait-soft:#3A2F12;
  --night:#06121A; --night-2:#2A1446; --on-night:#F7F1FF;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A161C; --surface:#12242C; --surface-2:#1A2F39; --line:#24404B;
  --ink:#F2EEF7; --muted:#A49CB2;
  --violet:#C08AE8; --violet-soft:#2E2140; --magenta:#E77AD9; --cyan:#5EE3E8; --cyan-glow:#5EE3E8;
  --ok:#4FD39C; --ok-soft:#123A2C; --no:#FF8094; --no-soft:#3E1C25; --wait:#F2C94C; --wait-soft:#3A2F12;
  --night:#06121A; --night-2:#2A1446; --on-night:#F7F1FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--violet)}
:focus-visible{outline:3px solid var(--magenta);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;border-radius:12px;color:var(--muted);font-size:11px;font-weight:700;text-decoration:none}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--violet);background:var(--violet-soft)}

@media (min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:26px 18px;background:var(--surface);border-right:1px solid var(--line)}
  .side .nav{display:flex;flex-direction:column;gap:4px}
  .side .tab{flex-direction:row;gap:12px;padding:11px 14px;font-size:15px;justify-content:flex-start}
  .main{padding-block:32px 48px;padding-left:40px;padding-right:40px}
}

/* ---------- brand ---------- */
.brand{display:flex;align-items:center;gap:12px}
.mono{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 30% 25%,#5B2B8E 0%,var(--night-2) 45%,var(--night) 100%);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.mono span{font-family:var(--f-script);font-weight:700;font-size:22px;color:#fff;letter-spacing:-.5px;transform:rotate(-6deg)}
.mono i{position:absolute;top:5px;right:7px;color:var(--star);font-style:normal;font-size:10px}
.brand b{font-family:var(--f-display);font-size:15px;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:12px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted)}
.side-foot em{font-family:var(--f-script);font-style:normal;font-size:20px;color:var(--magenta);display:block}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar .brand{display:flex}
@media (min-width:900px){.topbar .brand{display:none}}

/* ---------- child chips ---------- */
.kids{display:flex;gap:8px;flex-wrap:wrap}
.kid{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.kid .av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--violet-soft);color:var(--violet);font-family:var(--f-display);font-size:13px}
.kid small{color:var(--muted);font-weight:700;font-size:12px}
.kid[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.kid.add{padding:6px 14px;color:var(--violet);border-style:dashed}

/* ---------- section heads ---------- */
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sh h2{font-size:22px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.link{background:none;border:0;color:var(--violet);font-weight:800;padding:4px 0}
.page-title{display:flex;flex-direction:column;gap:6px}
.page-title h1{font-size:clamp(28px,5vw,40px);font-weight:800}
.page-title p{margin:0;color:var(--muted);max-width:60ch}
.script{font-family:var(--f-script);font-weight:700;color:var(--magenta);font-size:1.25em;line-height:1}

/* ---------- hero (next class) ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);color:var(--on-night);
  background:
    radial-gradient(120% 90% at 100% 0%,rgba(157,46,148,.55) 0%,transparent 55%),
    radial-gradient(90% 80% at 0% 100%,rgba(114,47,157,.6) 0%,transparent 60%),
    linear-gradient(160deg,var(--night-2),var(--night));
  padding:22px;display:grid;gap:18px}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 32% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 76% 62%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 35%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 46% 88%,#fff 50%,transparent 51%)}
.hero > *{position:relative}
.hero .eyebrow{color:rgba(247,241,255,.72)}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hero h2{font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:-.02em}
.hero .when{font-size:17px;font-weight:700}
.hero .where{color:rgba(247,241,255,.78);font-size:14px;display:flex;align-items:center;gap:6px}
.grp-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;white-space:nowrap}
.stars{color:var(--star);letter-spacing:1px}
.stars .off{opacity:.3}
.hero .note{font-size:13px;color:rgba(247,241,255,.72);margin:0}
.hero .script{color:#F7B8EF}

/* ---------- presence control ---------- */
.rsvp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rsvp button{border-radius:var(--r-md);padding:13px 10px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);transition:transform .12s ease,background .15s ease}
.rsvp button:active{transform:scale(.97)}
.rsvp button svg{width:18px;height:18px}
.rsvp .yes[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.rsvp .no[aria-pressed="true"]{background:var(--no);border-color:var(--no);color:#fff}
.hero .rsvp button{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.28);color:#fff}
.hero .rsvp .yes[aria-pressed="true"]{background:#1FAE78;border-color:#1FAE78}
.hero .rsvp .no[aria-pressed="true"]{background:#E0506A;border-color:#E0506A}
.reasons{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.reasons span{color:var(--muted);font-weight:700}
.hero .reasons span{color:rgba(247,241,255,.72)}
.reason{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-weight:700;font-size:13px}
.hero .reason{border-color:rgba(255,255,255,.3);color:#fff}
.reason[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}

/* ---------- grids ---------- */
.two{display:grid;gap:22px;grid-template-columns:1fr}
@media (min-width:1100px){.two{grid-template-columns:1.25fr 1fr}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}

/* ---------- session list ---------- */
.week{display:flex;flex-direction:column;gap:8px}
.week-h{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 2px 0}
.sess{display:grid;grid-template-columns:58px 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;background:var(--surface-2);padding:6px 0;line-height:1.05}
.date small{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.date b{font-family:var(--f-display);font-size:24px;font-weight:800}
.sess-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.sess-line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.sess-line strong{font-size:15px}
.sess-meta{color:var(--muted);font-size:13px}
.sess .rsvp button{padding:9px 8px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.pill.off{background:var(--surface-2);color:var(--muted)}
.sess.cancel{background:transparent;border-style:dashed}
.sess.cancel .date b{color:var(--muted)}
.holiday{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--violet-soft);color:var(--ink)}
.holiday .script{font-size:24px}
.holiday small{display:block;color:var(--muted);font-weight:700}

/* ---------- planning summary ---------- */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.sum b{font-family:var(--f-display);font-size:28px;display:block;line-height:1.1}
.sum span{font-size:12px;font-weight:800;color:var(--muted)}
.sum.ok b{color:var(--ok)} .sum.no b{color:var(--no)} .sum.wait b{color:var(--wait)}
.bulk{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:999px;padding:10px 18px;font-weight:800;border:1.5px solid var(--violet);background:var(--violet);color:#fff}
.btn.ghost{background:transparent;color:var(--violet)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- events ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.events{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.events{grid-template-columns:1fr 1fr}}
.ev{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;min-width:0}
.ev-top{display:flex;gap:14px;align-items:flex-start}
.ev .date{width:58px;flex:none}
.ev .kind{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.kind.stage{color:var(--violet)} .kind.compet{color:var(--magenta)} .kind.fort{color:var(--wait)}
.ev h3{font-size:18px;margin-top:2px}
.ev p{margin:0;color:var(--muted);font-size:14px}
.ev-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.cap{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted);min-width:120px;flex:1}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--magenta));border-radius:999px}
.ev.past{opacity:.55}
.ex{display:inline-block;font-size:11px;font-weight:800;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px;vertical-align:middle}

/* ---------- club ---------- */
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.cards{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:18px}
.card p{margin:0;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mail{font-weight:800;user-select:all;word-break:break-all}
.links{display:flex;flex-direction:column}
.links a{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700}
.links a:first-child{border-top:0}
.links a span{color:var(--violet)}
.grp-table{display:flex;flex-direction:column;gap:8px}
.grp-row{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:var(--surface-2)}
.grp-row b{font-family:var(--f-display);font-size:17px;color:var(--violet)}
.grp-row small{color:var(--muted);font-weight:700}

/* ---------- coach ---------- */
.coach{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:800px){.coach{grid-template-columns:repeat(3,1fr)}}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:22px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;max-height:90vh;overflow:auto;animation:up .22s ease}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:13px;font-weight:800;color:var(--muted)}
.field input{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;font:inherit;background:var(--bg);color:var(--ink)}
fieldset{border:0;padding:0;margin:0}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:var(--r-md);padding:12px;cursor:pointer}
.opt input{accent-color:var(--violet);width:18px;height:18px}
.opt:has(input:checked){border-color:var(--violet);background:var(--violet-soft)}
.opt div{display:flex;flex-direction:column}
.opt small{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:800}
.stepper b{font-family:var(--f-display);font-size:22px;min-width:24px;text-align:center}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- déroulé ---------- */
.peek{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px 10px 10px;border-radius:var(--r-md);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff}
.peek small{display:block;color:rgba(247,241,255,.72);font-size:13px}
.peek-icons{display:flex;flex:none}
.peek-icons .ico{margin-left:-8px;box-shadow:0 0 0 2px var(--night-2)}
.peek-icons .ico:first-child{margin-left:0}
.ico{width:46px;height:46px;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center}
.ico svg{width:70%;height:70%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:30px;height:30px}
.plan-head{display:flex;flex-direction:column;gap:4px}
.plan{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.plan li{display:grid;grid-template-columns:46px 1fr;gap:14px;padding-bottom:16px;position:relative}
.plan li:not(:last-child)::before{content:"";position:absolute;left:22px;top:48px;bottom:2px;width:3px;border-radius:2px;background:var(--line)}
.plan b{font-family:var(--f-display);font-size:19px}
.plan small{color:var(--muted);font-weight:700}
.plan p{margin:2px 0 0;font-size:15px}
.plan-min{font-weight:800;color:var(--c);background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:13px}
.defi{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:var(--wait-soft)}
.defi-star{font-size:28px;line-height:1;color:var(--star);text-shadow:0 0 1px var(--wait)}
.defi p{margin:2px 0 0}
.bring{font-size:14px;color:var(--muted)}
.bring b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-weight:800;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
@media (min-width:900px){.toast{bottom:28px}}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r-lg);text-align:center;color:var(--muted)}
.proto{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}

/* ---------- v2 : plus simple, plus ludique ---------- */
.hello{font-size:clamp(30px,6vw,44px);font-weight:800;letter-spacing:-.02em}
.hello .script{font-size:1.15em}
.ask{font-family:var(--f-display);font-weight:800;font-size:18px}
.rsvp button{min-height:54px;font-size:17px;border-radius:16px}
.sess .rsvp button{min-height:46px;font-size:16px}
.rsvp .yes:not([aria-pressed="true"]){border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.rsvp .no:not([aria-pressed="true"]){border-color:color-mix(in srgb,var(--no) 35%,var(--line))}
.rsvp button[aria-pressed="true"]{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.06)}}
.reason{display:inline-flex;gap:6px;align-items:center;padding:7px 13px;font-size:14px}
.prog{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;border:0;background:var(--surface-2);border-radius:999px;padding:4px 14px 4px 4px;font-weight:800;font-size:14px;color:var(--violet)}
.prog .peek-icons .ico{box-shadow:0 0 0 2px var(--surface-2)}
.peek{width:100%}
.peek .go{margin-left:auto;font-size:28px;line-height:1;opacity:.8}
.peek b{font-family:var(--f-display);font-size:17px}
.hol-tag{justify-self:start;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px}
.hero .when{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:6px}
.btn.big{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;font-size:17px;border-radius:18px;width:100%}
.btn.big svg{width:20px;height:20px}
.allgood{background:var(--ok-soft);color:var(--ok);font-weight:800;border-radius:16px;padding:14px;text-align:center}
.big-emoji{font-size:30px}
.events.one{grid-template-columns:1fr}
.ev{flex-direction:row;align-items:flex-start;gap:14px;text-align:left;width:100%;color:var(--ink);transition:transform .15s ease}
.ev:hover{transform:translateY(-2px)}
.ev-ic{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--surface-2)}
.ev-stage .ev-ic{background:var(--violet-soft)} .ev-fort .ev-ic{background:var(--wait-soft)} .ev-compet .ev-ic{background:color-mix(in srgb,var(--magenta) 16%,var(--surface))}
.ev-ic.lg{width:64px;height:64px;font-size:34px}
.ev-main{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ev-main b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.ev-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.cap{flex-direction:row;align-items:center;gap:8px;min-width:0;flex:1}
.cap .bar{flex:1;max-width:90px}
.facts{display:flex;flex-direction:column;gap:6px;font-weight:700}
.x{position:sticky;top:0;align-self:flex-end;width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);font-weight:800;margin-bottom:-38px;z-index:1}
.plan-title{font-size:38px;color:var(--magenta)}
.plan li{align-items:center}
.plan p{color:var(--muted)}
.bag{display:flex;gap:8px;flex-wrap:wrap}
.bag span{background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opts.three .opt{flex-direction:column;align-items:center;text-align:center;gap:6px}
.opts.three .opt div{align-items:center}
.slogan{background:var(--violet-soft);border-color:transparent}
.slogan .script{font-size:30px}
.slogan small{color:var(--muted);font-weight:700}
.coach-n{font-family:var(--f-display);font-size:38px}
.spark{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);animation:spark .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(200deg) scale(.4);opacity:0}}
/* photos */
.albums{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.albums::-webkit-scrollbar{display:none}
.album{flex:none;width:140px;display:flex;flex-direction:column;gap:6px;border:0;background:none;text-align:left;padding:0}
.album .cover{aspect-ratio:1;max-width:100%;border-radius:18px;border:3px solid transparent;display:grid;place-items:center;font-size:42px}
.album[aria-pressed="true"] .cover{border-color:var(--violet)}
.album b{font-size:14px;line-height:1.2}
.album small{color:var(--muted);font-weight:700;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,1fr);gap:10px}}
.ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;border:0;padding:0;display:grid;place-items:center;font-size:34px;background:var(--surface-2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .hrt{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:2px 8px}
.ph.wide{grid-column:span 2;grid-row:span 2;aspect-ratio:auto}
.upload{position:relative;background:none;width:100%;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--line);border-radius:18px;padding:14px;font-weight:800;color:var(--violet);cursor:pointer}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.privacy{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);font-weight:700}
.lb{position:fixed;inset:0;z-index:45;background:rgba(6,10,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb .shot{width:min(92vw,560px);aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;font-size:90px}
.lb .shot img{width:100%;height:100%;object-fit:contain;background:#000}
.lb-bar{display:flex;gap:12px;align-items:center;color:#fff;font-weight:800}
.lb-bar button{border:0;border-radius:999px;padding:12px 20px;font-weight:800;font-size:16px;background:rgba(255,255,255,.14);color:#fff}
.lb-bar .liked{background:#E0506A}
.coach-link{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);font-weight:800}


/* documents */
.docs{display:flex;flex-direction:column;gap:8px}
.doc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 12px;text-align:left;width:100%;color:var(--ink)}
.doc-ic{width:48px;height:48px;flex:none;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:26px}
.doc-main{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;flex:1}
.doc-main b{font-size:15px;line-height:1.25}
.doc.done{background:transparent}
.go-doc{font-size:26px;color:var(--muted)}
@media (max-width:380px){.tab{font-size:10px}.tab svg{width:20px;height:20px}}


/* logo du club */
.logo{border-radius:50%;display:block;max-width:100%;height:auto;box-shadow:0 6px 22px rgba(114,47,157,.35)}
.side-logo{display:flex;justify-content:center}
.side-logo .logo{width:150px}
.topbar .logo{width:52px}
.brand small{display:block;font-weight:700}
.club-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.club-head .logo{width:120px}
.script{background:linear-gradient(100deg,var(--magenta),var(--violet) 45%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero .script{background:none;color:#F7B8EF}
.plan-title.script{background:linear-gradient(100deg,var(--magenta),var(--violet) 50%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.side-foot em{background:linear-gradient(100deg,var(--magenta),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--violet)}
.hero{box-shadow:inset 0 0 0 1.5px rgba(94,227,232,.25)}
.hero::after{content:"";position:absolute;inset:auto -30% -60% auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(94,227,232,.22),transparent 65%);pointer-events:none}
.grp-badge{border-color:rgba(94,227,232,.45)}
.tab[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--cyan)}
@media (min-width:900px){.tab[aria-current="page"]{box-shadow:inset 3px 0 0 var(--cyan)}}
.bar i{background:linear-gradient(90deg,var(--violet),var(--cyan))}


/* messagerie */
.tab-ic{position:relative;display:inline-flex}
.badge{position:absolute;top:-6px;right:-10px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--no);color:#fff;font-style:normal;font-size:11px;font-weight:800;display:grid;place-items:center;line-height:1}
.chat{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:900px){.chat{grid-template-columns:300px 1fr;align-items:start}}
@media (max-width:899px){.chat.has-chan .chans{display:none}.chat:not(.has-chan) .empty-thread{display:none}}
.chans{display:flex;flex-direction:column;gap:8px}
.chan{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 12px;color:var(--ink)}
.chan.on{border-color:var(--violet);background:var(--violet-soft)}
.chan .badge{position:static;margin-left:auto;flex:none}
.chan-ic{width:46px;height:46px;flex:none;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;font-size:24px}
.chan-main{display:flex;flex-direction:column;min-width:0}
.chan-main b{font-size:15px}
.chan-main small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;min-width:0;height:min(68vh,620px)}
.empty-thread{align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:700}
.thread-head{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.thread-head b{display:block;font-size:15px}
.thread-head small{color:var(--muted);font-size:12px}
.thread-head .chan-ic{width:38px;height:38px;font-size:20px;border-radius:12px}
.back{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:24px;line-height:1;flex:none}
@media (min-width:900px){.back{display:none}}
.msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.m-av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:hsl(var(--h) 55% 50%)}
.bub-wrap{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.me .bub-wrap{align-items:flex-end}
.who{font-size:12px;font-weight:800;color:var(--muted);padding-left:4px}
.coach-tag{background:linear-gradient(90deg,var(--violet),var(--cyan));color:#fff;border-radius:6px;padding:0 6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase}
.bub{background:var(--surface);border:1px solid var(--line);padding:9px 13px;border-radius:18px 18px 18px 6px;font-size:15px;overflow-wrap:anywhere}
.msg.me .bub{background:linear-gradient(135deg,var(--violet),var(--magenta));border:0;color:#fff;border-radius:18px 18px 6px 18px}
.msg.pin .bub{background:var(--wait-soft);border-color:transparent}
.m-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);padding:0 4px}
.heart{border:0;background:none;color:var(--muted);font-weight:800;font-size:12px;padding:2px 4px;border-radius:999px}
.heart.on{color:var(--no)}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.5}}
.quick{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.composer{display:flex;gap:8px;padding:10px 12px 12px}
.composer input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:999px;padding:12px 16px;font:inherit;background:var(--bg);color:var(--ink)}
.send{width:48px;height:48px;flex:none;border:0;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--magenta));color:#fff;display:grid;place-items:center}
a.brand{text-decoration:none;color:var(--ink)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function planFor(group,sess){
  const wk=Math.floor((sess.date - new Date(2026,8,7))/(7*864e5));
  const p=PLANS[((wk%3)+3+(sess.s<'12:00'?1:0))%3];
  const [h1,m1]=sess.s.split(':').map(Number),[h2,m2]=sess.e.split(':').map(Number);
  const total=(h2*60+m2)-(h1*60+m1); const w=p.steps.reduce((a,s)=>a+s[1],0);
  let t=h1*60+m1, left=total;
  const steps=p.steps.map((s,i)=>{let m=i===p.steps.length-1?left:Math.max(5,Math.round(total*s[1]/w/5)*5); left-=m;
    const st={k:s[0],min:m,txt:s[2],at:`${Math.floor(t/60)}h${pad(t%60)}`}; t+=m; return st});
  return {...p,steps,total};
}

const today = new Date(); today.setHours(0,0,0,0);

function sessions(group, weeks=10){
  const out=[]; const g=GROUPS[group]; const seenHol=new Set();
  for(let i=0;i<weeks*7;i++){
    const d=new Date(today); d.setDate(today.getDate()+i); const s=iso(d);
    const hol=holidayOf(s);
    if(hol){ if(!seenHol.has(hol[2]) && g.slots.some(sl=>true)){seenHol.add(hol[2]);out.push({type:'hol',hol,date:d})} continue; }
    g.slots.forEach(sl=>{ if(d.getDay()===sl.d){
      out.push({type:'sess',date:d,key:`${s}|${sl.s}`,s:sl.s,e:sl.e,ferie:FERIES[s]||null});
    }});
  }
  return out;
}
const keyFor = (k,sess) => `${k.id}|${sess.key}`;
const weekLabel = d => {
  const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7));
  const diff=Math.round((mon-((()=>{const m=new Date(today);m.setDate(today.getDate()-((today.getDay()+6)%7));return m})()))/864e5/7);
  if(diff===0) return 'Cette semaine'; if(diff===1) return 'Semaine prochaine';
  return 'Semaine du '+fr(mon,{day:'numeric',month:'long'});
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function rsvpControl(k,sess,ask){
  const key=keyFor(k,sess); const st=rsvp[key];
  const rs = st==='no' ? `<div class="reasons">${[['Malade','🤒'],['Famille','🏠'],['Autre','💬']].map(([r,e])=>`<button class="reason" data-reason="${r}" data-key="${key}" aria-pressed="${reasons[key]===r}"><span aria-hidden="true">${e}</span>${r}</button>`).join('')}</div>`:'';
  return `${ask?`<div class="ask">${esc(k.name)} vient ?</div>`:''}<div class="rsvp" role="group" aria-label="${esc(k.name)} vient au cours ?">
    <button class="yes" data-rsvp="yes" data-key="${key}" aria-pressed="${st==='yes'}">${I.yes}Oui</button>
    <button class="no" data-rsvp="no" data-key="${key}" aria-pressed="${st==='no'}">${I.no}Non</button>

}
const forGroup = (ev,g) => ev.groups==='all' || ev.groups.includes(g);
const KIND_IC = {stage:'🤸',compet:'🏅',fort:'🎉'};
function eventCard(ev,k){
  const d=parse(ev.date), past=(ev.end?parse(ev.end):d)<today;
  const mine=regs[`${k.id}|${ev.id}`]; const ok=forGroup(ev,k.group);
  const left=ev.cap-ev.taken-(mine?1:0);
  const range = ev.end ? `${fr(d,{day:'numeric'})} → ${fr(parse(ev.end),{day:'numeric',month:'short'})}` : fr(d,{weekday:'short',day:'numeric',month:'short'});
  let action;
  if(past) action='<span class="pill off">Terminé</span>';
  else if(mine) action=`<span class="pill ok">✓ Inscrite</span>`;
  else if(!ok) action=`<span class="pill off">${ev.groups.join(', ')}</span>`;
  else if(left<=0) action='<span class="pill no">Complet</span>';
  else action=`<span class="btn sm">Je m’inscris</span>`;
  return `<button class="ev ev-${ev.kind}${past?' past':''}" data-ev="${ev.id}">
    <span class="ev-ic" aria-hidden="true">${KIND_IC[ev.kind]}</span>
    <span class="ev-main"><span class="kind ${ev.kind}">${KIND[ev.kind]}</span><b>${ev.title}</b><span class="sess-meta tnum">${range} · ${ev.time}</span>
    <span class="ev-foot"><span class="cap tnum"><span class="bar"><i style="width:${Math.min(100,(ev.cap-left)/ev.cap*100)}%"></i></span>${Math.max(left,0)} places</span>${action}</span></span>
  </button>`;
}

  const c={yes:0,no:0,wait:0}; real.forEach(s=>{const v=rsvp[keyFor(k,s)];c[v||'wait']++});
  let html='', lastW='';
  list.forEach(s=>{ if(s.type==='hol'){html+=holidayRow(s);lastW='';return}
    const w=weekLabel(s.date); if(w!==lastW){html+=`<div class="week-h">${w}</div>`;lastW=w}

function seeded(g,i){let x=(g.charCodeAt(4)*97+i*31)%100;return x/100}
function vCoachs(){
  return `
  <h1 class="hello">Qui <span class="script">vient ?</span></h1>
  <div class="coach">${Object.entries(GROUPS).map(([n,g])=>{
    const s=sessions(n,6).find(x=>x.type==='sess'&&!x.ferie); if(!s) return '';
    let yes=Math.round(g.effectif*(.45+seeded(n,1)*.25)), no=Math.round(g.effectif*(.08+seeded(n,2)*.1));
    kids.filter(k=>k.group===n).forEach(k=>{const v=rsvp[keyFor(k,s)]; if(v==='yes')yes++; if(v==='no')no++});
    const tot=g.effectif; yes=Math.min(yes,tot); no=Math.min(no,tot-yes); const wait=tot-yes-no;
    return `<section class="card"><div class="row"><h3>${n}</h3><span class="sess-meta tnum">${fr(s.date,{weekday:'short',day:'numeric'})} · ${hhmm(s.s)}</span></div>
      <div><b class="coach-n tnum">${yes}</b> <span class="sess-meta">/ ${tot}</span></div>
      <div class="stack" aria-hidden="true"><i style="width:${yes/tot*100}%;background:var(--ok)"></i><i style="width:${no/tot*100}%;background:var(--no)"></i><i style="width:${wait/tot*100}%;background:var(--star)"></i></div>
      <div class="legend tnum"><span><i class="dot" style="background:var(--ok)"></i>${yes} oui</span><span><i class="dot" style="background:var(--no)"></i>${no} non</span><span><i class="dot" style="background:var(--star)"></i>${wait} ?</span></div>

}

    <div class="docs">${TODO_DOCS.map(d=>{const v=st(d);return `<div class="doc${v?' done':''}"><span class="doc-ic" aria-hidden="true">${d.ic}</span><span class="doc-main"><b>${d.name}</b>${v?`<span class="pill ok">✓ ${v}</span>`:`<span class="pill wait">Avant le ${d.due}</span>`}</span>${v?'':`<button class="btn sm" data-send="${d.id}">📷 Envoyer</button>`}</div>`}).join('')}</div>
  </section>
  <section class="col"><div class="sh"><h2>Du club pour vous</h2></div>
    <div class="docs">${CLUB_DOCS.map(d=>`<button class="doc" data-open="${d.id}"><span class="doc-ic" aria-hidden="true">${d.ic}</span><span class="doc-main"><b>${d.name}</b><small class="sess-meta">${d.info}</small></span>${d.isNew&&!opened[d.id]?'<span class="pill no">Nouveau</span>':'<span class="go-doc" aria-hidden="true">›</span>'}</button>`).join('')}</div>
  </section>
  <button class="upload" data-send="libre">📎 Envoyer un autre document au club</button>
  <input id="docIn" type="file" accept="image/*,application/pdf" hidden>
  <p class="proto">Documents donnés en exemple</p>`;
}


/* ================= messagerie (exemples) ================= */
const CHANNELS = {
  gaf:{id:'gaf',ic:'🤸',name:()=>`Parents ${kid().group}`,desc:'Les familles du groupe',unread:2},
  club:{id:'club',ic:'❓',name:()=>'Questions au club',desc:'Les coachs et le bureau répondent',unread:1},
  all:{id:'all',ic:'💜',name:()=>'Tous les parents',desc:'Toute la commu AGM',unread:0},
  covoit:{id:'covoit',ic:'🚗',name:()=>'Covoiturage Cuers',desc:'On s’organise pour les trajets',unread:3},
};
const SEED = {
  gaf:[{who:'Coach Manon',coach:1,t:'Lun. 19:02',txt:'Super séance ce soir ! Mercredi on attaque la poutre 🤸'},{who:'Sarah (maman de Jade)',t:'Lun. 20:41',txt:'Jade a adoré, elle ne parle que de ça 😄',h:4},{who:'Karim (papa d’Inès)',t:'Hier 18:10',txt:'Quelqu’un a trouvé une gourde bleue au gymnase ?'}],
  club:[{who:'Le bureau AGM',coach:1,t:'Lun. 09:00',txt:'📌 Posez ici vos questions sur les cours, les licences ou les stages. On répond sous 48 h.',pin:1},{who:'Julie (maman de Rose)',t:'Hier 12:30',txt:'Les justaucorps du club sont dispo quand ?'},{who:'Le bureau AGM',coach:1,t:'Hier 14:05',txt:'Commande groupée fin novembre, on vous envoie le bon dans Docs 👍',h:6}],
  all:[{who:'Le bureau AGM',coach:1,t:'Sam. 10:00',txt:'Bienvenue dans la commu AGM 💜 Bienveillance et bonne humeur obligatoires !',pin:1,h:12}],
  covoit:[{who:'Nadia (maman de Lou)',t:'Hier 17:20',txt:'Je pars de Pierrefeu lundi 17h50, 2 places dispo 🚗'},{who:'Tom (papa de Zoé)',t:'Hier 17:45',txt:'Je prends le retour à 20h30 si besoin !'},{who:'Nadia (maman de Lou)',t:'Hier 18:02',txt:'Top, merci 🙏',h:2}],
};
const QUICK = {gaf:['👍 Merci !','Elle sera là 😊','Bravo les filles ! 👏'],club:['Merci beaucoup !','J’ai une question sur le stage'],all:['Bonjour à tous 👋','Merci !'],covoit:['J’ai 2 places 🚗','Quelqu’un passe par Pierrefeu ?','Merci 🙏']};
let chan=null, myMsgs=store.get('msgs',{}), hearts=store.get('hearts',{}), seenCh=store.get('seen',{}), typing=false;
const avatar = n => `<span class="m-av" style="--h:${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360}">${esc(n[0])}</span>`;
function chanList(){
  return `<div class="chans">${Object.values(CHANNELS).map(c=>{const last=[...SEED[c.id],...(myMsgs[c.id]||[])].slice(-1)[0];const un=seenCh[c.id]?0:c.unread;
    return `<button class="chan${chan===c.id?' on':''}" data-chan="${c.id}"><span class="chan-ic" aria-hidden="true">${c.ic}</span><span class="chan-main"><b>${c.name()}</b><small>${last?esc((last.me?'Vous : ':'')+last.txt):c.desc}</small></span>${un?`<i class="badge">${un}</i>`:''}</button>`}).join('')}</div>`;
}
function chanView(){
  const c=CHANNELS[chan]; const list=[...SEED[chan],...(myMsgs[chan]||[])];
  return `<div class="thread">
    <div class="thread-head"><button class="back" data-chan="" aria-label="Retour aux discussions">‹</button><span class="chan-ic" aria-hidden="true">${c.ic}</span><div><b>${c.name()}</b><small>${c.desc}</small></div></div>
    <div class="msgs" id="msgs">${list.map((m,i)=>{const hk=`${chan}|${i}`;const n=(m.h||0)+(hearts[hk]?1:0);
      return `<div class="msg${m.me?' me':''}${m.pin?' pin':''}">${m.me?'':avatar(m.who)}<div class="bub-wrap">${m.me?'':`<span class="who">${esc(m.who)}${m.coach?' <span class="coach-tag">Club</span>':''}</span>`}
      <div class="bub">${esc(m.txt)}</div><div class="m-meta"><span>${m.t}</span><button class="heart${hearts[hk]?' on':''}" data-heart="${hk}" aria-label="J’aime">♥${n?` ${n}`:''}</button></div></div></div>`}).join('')}
      ${typing?`<div class="msg">${avatar('Coach')}<div class="bub-wrap"><div class="bub typing"><i></i><i></i><i></i></div></div></div>`:''}</div>
    <div class="quick">${(QUICK[chan]||[]).map(q=>`<button class="chip" data-quick="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form class="composer" id="composer"><input id="msgIn" autocomplete="off" placeholder="Écrire un message…" aria-label="Message"><button class="send" aria-label="Envoyer"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2.5-6.5z"/></svg></button></form>
  </div>`;
}
function vMessages(){
  return `<h1 class="hello">La <span class="script">commu</span></h1>
  <div class="chat${chan?' has-chan':''}">${chanList()}${chan?chanView():'<div class="thread empty-thread"><span class="big-emoji">💬</span>Choisis une discussion</div>'}</div>
  <p class="proto">Messages donnés en exemple · dans ce prototype, tes messages restent sur ton appareil</p>`;
}
function sendMsg(txt){
  txt=txt.trim(); if(!txt||!chan) return;
  const now=new Date(); (myMsgs[chan]=myMsgs[chan]||[]).push({me:1,who:'Moi',t:`${pad(now.getHours())}:${pad(now.getMinutes())}`,txt});
  store.set('msgs',myMsgs);
  if(chan==='club'){ typing=true; const c=chan; setTimeout(()=>{typing=false;const n=new Date();myMsgs[c].push({who:'Coach Manon',coach:1,t:`${pad(n.getHours())}:${pad(n.getMinutes())}`,txt:'Merci pour ton message ! On te répond très vite 😊'});store.set('msgs',myMsgs);if(route()==='messages'&&chan===c){render();focusChat()}},1600); }
  render(); focusChat();
}
function focusChat(){const m=document.getElementById('msgs'); if(m) m.scrollTop=m.scrollHeight; const i=document.getElementById('msgIn'); if(i&&matchMedia('(min-width:900px)').matches) i.focus();}

/* ================= sheets ================= */
function openSheet(html){
  document.getElementById('layer').innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-close aria-label="Fermer">✕</button>${html}</div></div>`;
  const f=document.querySelector('.sheet input, .sheet .btn'); f&&f.focus();
}
const closeSheet=()=>document.getElementById('layer').innerHTML='';
function planSheet(key){
  const k=kid(); const s=sessions(k.group,16).find(x=>x.type==='sess'&&x.key===key); if(!s) return;
  const p=planFor(k.group,s);
  openSheet(`<div class="plan-head"><span class="eyebrow">${cap1(fr(s.date,{weekday:'long',day:'numeric',month:'long'}))} · ${hhmm(s.s)}</span><h2 class="script plan-title">${p.theme}</h2></div>
  <ol class="plan">${p.steps.map(st=>{const a=APPARATUS[st.k];return `<li style="--c:${a.col}">${ico(st.k)}
    <div><div class="row"><b>${a.name}</b><span class="tnum plan-min">${st.min} min</span></div><p>${st.txt}</p></div></li>`}).join('')}</ol>
  <div class="defi"><span class="defi-star">★</span><div><b>Ton défi</b><p>${p.defi}</p></div></div>
  <div class="bag" aria-label="Dans le sac"><span>💧 Gourde</span><span>🎀 Cheveux attachés</span><span>🚫 Pas de bijoux</span></div>
  <button class="btn big" data-close>J’ai hâte ! 🤸</button>`);
}
function kidSheet(){
  openSheet(`<h2>Ajouter un enfant</h2>
  <form id="kidForm" style="display:flex;flex-direction:column;gap:16px">
    <div class="field"><label for="kname">Prénom</label><input id="kname" required maxlength="20" placeholder="Prénom"></div>
    <fieldset class="field"><legend>Son groupe</legend><div class="opts three">${Object.entries(GROUPS).map(([n,g],i)=>`<label class="opt"><input type="radio" name="grp" value="${n}" ${i===0?'checked':''}><div><b>${n}</b>${stars(g.n)}</div></label>`).join('')}</div></fieldset>
    <button class="btn big">Ajouter</button>
  </form>`);
}
function evSheet(id){
  const ev=EVENTS.find(e=>e.id===id); const k=kid(); const key=`${k.id}|${ev.id}`; const mine=regs[key];
  const d=parse(ev.date), past=(ev.end?parse(ev.end):d)<today, left=ev.cap-ev.taken-(mine?1:0), ok=forGroup(ev,k.group);
  const range = ev.end ? `Du ${fr(d,{day:'numeric'})} au ${fr(parse(ev.end),{day:'numeric',month:'long'})}` : cap1(fr(d,{weekday:'long',day:'numeric',month:'long'}));
  let action;
  if(past) action='<span class="pill off">Terminé</span>';
  else if(mine) action=`<div class="allgood">✓ ${esc(k.name)} est inscrite${mine.guests?` · +${mine.guests}`:''}</div><button class="link" data-unreg="${ev.id}">Annuler l’inscription</button>`;
  else if(!ok) action=`<div class="empty">Réservé aux ${ev.groups.join(', ')}</div>`;
  else if(left<=0) action='<div class="empty">Complet</div>';
  else action=`${ev.guests?`<div class="field"><label>On vient à combien en plus ?</label><div class="stepper"><button type="button" data-step="-1" aria-label="Moins">−</button><b id="g" class="tnum">1</b><button type="button" data-step="1" aria-label="Plus">+</button></div></div>`:''}<button class="btn big" data-confirm="${ev.id}">Inscrire ${esc(k.name)}</button>`;
  openSheet(`<span class="ev-ic lg" aria-hidden="true">${KIND_IC[ev.kind]}</span><span class="kind ${ev.kind}">${KIND[ev.kind]}</span><h2>${ev.title}</h2>
  <div class="facts"><span>📅 ${range}</span><span>⏰ ${ev.time}</span><span>💶 ${ev.price}</span></div>
  <p class="sess-meta" style="margin:0">${ev.text}</p>${action}`);
}

/* ================= rendu & événements ================= */
function route(){return (location.hash||'#accueil').slice(1)}
function render(){
  const r=[...TABS,...EXTRA].some(t=>t[0]===route())?route():'accueil';
  const unread=Object.values(CHANNELS).reduce((a,c)=>a+(seenCh[c.id]?0:c.unread),0);
  const nav=TABS.map(([id,l,ic])=>`<a class="tab" href="#${id}" ${id===r?'aria-current="page"':''}><span class="tab-ic">${ic}${id==='messages'&&unread?`<i class="badge">${unread}</i>`:''}</span><span>${l}</span></a>`).join('');
  const nav2=nav+EXTRA.map(([id,l,ic])=>`<a class="tab" href="#${id}" ${id===r?'aria-current="page"':''}>${ic}<span>${l}</span></a>`).join('');
  document.getElementById('sideNav').innerHTML=nav2; document.getElementById('tabNav').innerHTML=nav;
  document.getElementById('view').innerHTML={accueil:vAccueil,planning:vPlanning,agenda:vAgenda,photos:vPhotos,messages:vMessages,docs:vDocs,club:vClub,coachs:vCoachs}[r]();
}
function burst(r){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#FFCC00','#9D2E94','#722F9D','#2D9CDB','#27AE60','#F2994A'];
  for(let i=0;i<18;i++){const e=document.createElement('span');e.className='spark';e.textContent=i%3?'★':'●';
    const a=Math.random()*Math.PI*2, dist=60+Math.random()*90;
    e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;color:${cols[i%cols.length]};--dx:${Math.cos(a)*dist}px;--dy:${Math.sin(a)*dist-40}px;font-size:${10+Math.random()*12}px`;
    document.body.appendChild(e); setTimeout(()=>e.remove(),900);}
}
function toast(msg){
  const t=document.createElement('div');t.className='toast';t.role='status';t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-close],[data-lbclose]'); if(!b) return;
  const d=b.dataset;
  if('close' in d && (b.tagName==='BUTTON'||e.target===b)){closeSheet();return}
  if(d.rsvp){ rsvp[d.key]=rsvp[d.key]===d.rsvp?undefined:d.rsvp; if(rsvp[d.key]!=='no') delete reasons[d.key]; if(!rsvp[d.key]) delete rsvp[d.key];
    const r=b.getBoundingClientRect(); save();render(); if(rsvp[d.key]==='yes'){burst(r);toast(`Youpi ! À bientôt ${kid().name} 🤸`)} else if(rsvp[d.key]) toast('C’est noté, les coachs sont prévenus'); }
  else if(d.reason){ reasons[d.key]=reasons[d.key]===d.reason?undefined:d.reason; save();render(); }
  else if(d.plan){ planSheet(d.plan); }
  else if(d.send){ pendingDoc=d.send; document.getElementById('docIn').click(); }
  else if(d.open){ opened[d.open]=true; store.set('opened',opened); render(); toast('📄 Le document s’ouvre ici dans la vraie appli'); }
  else if('chan' in d){ chan=d.chan||null; if(chan){seenCh[chan]=1;store.set('seen',seenCh)} render(); focusChat(); }
  else if(d.quick){ sendMsg(d.quick); }
  else if(d.heart){ const r=b.getBoundingClientRect(); hearts[d.heart]=!hearts[d.heart]; store.set('hearts',hearts); const y=document.getElementById('msgs')?.scrollTop; render(); const m=document.getElementById('msgs'); if(m&&y!=null) m.scrollTop=y; if(hearts[d.heart]) burst(r); }
  else if(d.album){ album=d.album; render(); }
  else if(d.ph){ openLb(+d.ph); }
  else if(d.lb){ const n=albumPhotos().length; openLb((lbIndex+ +d.lb+n)%n); }
  else if(d.like){ const r=b.getBoundingClientRect(); likes[d.like]=!likes[d.like]; store.set('likes',likes); if(likes[d.like]) burst(r); openLb(lbIndex); }
  else if('lbclose' in d){ if(b.tagName==='BUTTON'||e.target===b){ closeSheet(); render(); } }
  else if(d.kid){ activeKid=d.kid;save();render(); }
  else if('addkid' in d){ kidSheet(); }
  else if(d.filter){ evFilter=d.filter;render(); }
  else if(d.ev){ evSheet(d.ev); }
  else if(d.step){ const g=document.getElementById('g'); g.textContent=Math.max(0,Math.min(6,+g.textContent+ +d.step)); }
  else if(d.confirm){ const g=document.getElementById('g'); const r=b.getBoundingClientRect(); regs[`${kid().id}|${d.confirm}`]={guests:g?+g.textContent:0}; save();closeSheet();render();burst(r); toast(`🎉 ${kid().name} est inscrite !`); }
  else if(d.unreg){ delete regs[`${kid().id}|${d.unreg}`]; save();closeSheet();render(); toast('Inscription annulée'); }
  else if(d.bulk){ const k=kid(); sessions(k.group,10).filter(s=>s.type==='sess'&&!s.ferie).forEach(s=>{const key=keyFor(k,s); if(d.bulk==='reset'){delete rsvp[key];delete reasons[key]} else if(!rsvp[key]) rsvp[key]='yes'}); const r=b.getBoundingClientRect(); save();render(); if(d.bulk==='reset') toast('Réponses effacées'); else {burst(r);toast('🎉 Super, tout est confirmé !')} }
  else if(d.copy){ const t=document.getElementById(d.copy).textContent; const done=()=>toast('Adresse copiée');
    try{navigator.clipboard.writeText(t).then(done,()=>{getSelection().selectAllChildren(document.getElementById(d.copy));toast('Adresse sélectionnée, copie-la')})}catch(err){getSelection().selectAllChildren(document.getElementById(d.copy))} }
  else if(d.toast){ toast(d.toast); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='docIn'&&e.target.files.length){ const r=document.querySelector(`[data-send="${pendingDoc}"]`)?.getBoundingClientRect();
    if(pendingDoc!=='libre'){ sent[`${kid().id}|${pendingDoc}`]='Envoyé'; store.set('sent',sent); }
    render(); if(r) burst(r); toast('✓ Envoyé au club, merci !'); return; }
  if(e.target.id!=='phIn') return;
  [...e.target.files].slice(0,12).forEach(f=>{const r=new FileReader();r.onload=()=>{added.unshift({id:'u'+Date.now()+Math.random(),album,src:r.result,base:1});render()};r.readAsDataURL(f)});
  toast('📷 Photos ajoutées (sur cet appareil)');
});
document.addEventListener('submit',e=>{
  if(e.target.id==='composer'){ e.preventDefault(); sendMsg(document.getElementById('msgIn').value); return; }
  if(e.target.id!=='kidForm') return; e.preventDefault();
  const name=document.getElementById('kname').value.trim(); if(!name) return;
  const group=new FormData(e.target).get('grp'); const id='k'+Date.now();
  kids.push({id,name,group}); activeKid=id; save(); closeSheet(); render(); toast(`👋 Bienvenue ${name} !`);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();render()} if(lbIndex!==null&&document.querySelector('.lb')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const n=albumPhotos().length;openLb((lbIndex+(e.key==='ArrowRight'?1:-1)+n)%n)}});
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
document.getElementById("sideLogo").src=LOGO;
render();
</script>
